name: check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      security-events: write
    uses: nifeos/crate-workflows/.github/workflows/check.yml@a6330bb8763d43948a33ba38a0f4bf576dbd57b5
    with:
      # Bare-metal targets the crate builds for, space-separated; empty for a host-only crate.
      targets: aarch64-unknown-none-softfloat riscv64imac-unknown-none-elf x86_64-unknown-none
      # Nothing is published yet, so the manifest carries publish = false on purpose; this input
      # comes out with that line, in the pull request that releases the first published version.
      allow-unpublished: true
