name: proofs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proofs:
    uses: nifeos/crate-workflows/.github/workflows/proofs.yml@4e5b07dd166ac4bae214ad59249d3fed3c92cd66
