name: proofs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Kani, the falsification replay and, for a crate that depends on loom, its loom models. A crate
  # whose models need a preemption bound passes `loom-max-preemptions: <n>` under `with:`.
  proofs:
    uses: nifeos/crate-workflows/.github/workflows/proofs.yml@4d9eea223edab7761a9f358995834bc52e4c8c39
